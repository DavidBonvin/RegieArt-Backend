# Railway configuration for the Keycloak service.
# In Railway UI, set this service's Root Directory to: /keycloak
# Railway will use this file automatically.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health/ready"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
