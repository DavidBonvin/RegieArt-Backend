# Railway configuration for the NestJS API service
# This file configures the main API service build & deploy settings.
# Point this service to the root (/) of the repository in Railway UI.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
