version: '3.8'

# 'regiart' is the shared network used by the frontend repo (fronted-regieArt)
# to reach these infra containers by hostname. Create it once with:
#   docker network create regiart
networks:
  regiart:
    external: true

services:
  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: regieart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5433:5432'
    networks:
      - default
      - regiart
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Keycloak (SSO) ────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: regieart-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - '8090:8080'
    networks:
      - default
      - regiart
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: regieart-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - default
      - regiart
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API (NestJS) ──────────────────────────────────────────
  # Optional: only needed if you want the API fully dockerized instead of
  # running it locally with `pnpm dev:api`. Start it explicitly with:
  #   docker compose --profile docker-api up -d api
  api:
    profiles: ['docker-api']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: regieart-api
    restart: unless-stopped
    networks:
      - default
      - regiart
    environment:
      NODE_ENV: development
      PORT: 3000
      # Use docker service names instead of localhost
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/regieart?schema=public
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: regieart
      KEYCLOAK_CLIENT_ID: regieart-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me-in-production}
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:8081
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-RegieArt <noreply@regieart.com>}
      APP_URL: ${APP_URL:-http://localhost:3001}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME}
    ports:
      - '3005:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
