name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm --filter database prisma:generate

      - name: Run tests
        run: pnpm --filter api test

      - name: Build API
        run: pnpm --filter api build

  # Aquí podríamos agregar un job de despliegue ("deploy") si decidiéramos
  # hacerlo mediante GitHub Actions en el futuro. Por ahora, Railway 
  # detectará los cambios en la rama main y desplegará automáticamente.
